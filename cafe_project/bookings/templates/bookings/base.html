<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уютное Кафе — Бронирование столиков</title>
    <!-- Подключаем современный Tailwind CSS для красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- Навигационная панель (Шапка сайта) -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Логотип теперь ведет на главную страницу со столиками -->
            <a href="{% url 'tables_list' %}" class="text-2xl font-bold text-amber-600 hover:text-amber-700 transition">
                ☕ Кафе «Уют»
            </a>
            <div class="space-x-4 flex items-center">
                <!-- Ссылка на список столиков -->
                <a href="{% url 'tables_list' %}" class="text-gray-600 hover:text-amber-600 font-medium transition">Столики</a>

                {% if user.is_authenticated %}
                    <!-- Ссылка на личный кабинет с бронированиями -->
                    <a href="{% url 'my_reservations' %}" class="text-gray-600 hover:text-amber-600 font-medium transition">Мои брони</a>
                    <span class="text-sm bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-semibold">
                        👤 {{ user.username }}
                    </span>
                    <!-- Форма выхода с правильным адресом logout -->
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-red-500 hover:text-red-700 text-sm font-medium transition cursor-pointer">Выйти</button>
                    </form>
                {% else %}
                    <!-- Кнопка входа ведет на страницу авторизации -->
                    <a href="{% url 'login' %}" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Основной контент страницы -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Сюда Django будет автоматически подставлять код других страниц -->
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал (Footer) -->
    <footer class="bg-gray-900 text-gray-400 py-6 mt-auto text-center border-t border-gray-800">
        <p class="text-sm">© 2026 Кафе «Уют». Все права Copyleft. Домашнее задание по Django.</p>
    </footer>

</body>
</html>
